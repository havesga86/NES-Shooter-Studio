<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NES Shooter Studio - Universal NES ROM & Homebrew Toolkit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.0/build/stlite.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background-color: #0e0e18; }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.0/build/stlite.js"></script>
  <script>
    stlite.mount(
      {
        requirements: ["pillow"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "shooter.s": { url: "./shooter.s" },
          "shooter.nes": { url: "./shooter.nes" }
        }
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
